<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>靶紙射擊偵測與計分系統</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background:#f5f5f5; }
        #videoContainer, #canvasContainer { margin:10px; display:inline-block; vertical-align:top; }
        video, canvas { border:2px solid #333; background:#000; }
        #score { font-size:2em; margin-top:10px; color:#2c3e50; }
        button { padding:10px 20px; font-size:1em; margin:5px; }
        #controls { margin-top:10px; }
        #controls div { margin:5px 0; }
        label { margin-right:5px; }
        input[type=range] { width:200px; vertical-align:middle; }
        #exportBtn { margin-top:10px; }
        #saveImgBtn { margin-top:10px; }
        select { margin-left:5px; }
        .dl-status { font-size:0.9em; color:#555; margin-top:5px; }
        #sampleBtn { background:#4CAF50; color:white; }
        #sampleBtn.active { background:#45a049; }
        #clearSamplesBtn { background:#f44336; color:white; margin-left:5px; }
        #sampleInfo { font-size:0.9em; color:#333; margin-top:5px; }
    </style>
</head>
<body>
    <h1>靶紙射擊偵測與計分系統</h1>
    <div>
        <div id="videoContainer">
            <video id="webcam" width="640" height="480" autoplay playsinline></video>
        </div>
        <div id="canvasContainer">
            <canvas id="output" width="640" height="480"></canvas>
        </div>
    </div>
    <div>
        <button id="startBtn">啟動偵測</button>
        <button id="stopBtn" disabled>停止偵測</button>
        <button id="calibBtn">校正靶位</button>
        <button id="exportBtn" style="display:none;">匯出紀錄</button>
        <button id="saveImgBtn" style="display:none;">儲存影像</button>
        <div id="score">目前分數: 0</div>
    </div>
    <div id="controls" style="display:none;">
        <div>
            <label for="radiusSlider">靶心半徑: </label>
            <input type="range" id="radiusSlider" min="50" max="300" value="200">
            <span id="radiusValue">200</span> px
        </div>
        <div>
            <label>目前靶心座標: (<span id="centerX">320</span>, <span id="centerY">240</span>)</label>
        </div>
        <div>
            <label for="darkThresh">暗色門檻 (0-255): </label>
            <input type="range" id="darkThresh" min="0" max="255" value="50">
            <span id="darkThreshVal">50</span>
        </div>
        <div>
            <label for="minArea">最小面積: </label>
            <input type="range" id="minArea" min="1" max="100" value="10">
            <span id="minAreaVal">10</span> px²
        </div>
        <div>
            <label for="maxArea">最大面積: </label>
            <input type="range" id="maxArea" min="50" max="2000" value="500">
            <span id="maxAreaVal">500</span> px²
        </div>
        <div>
            <label>偵測方法: </label>
            <select id="methodSelect">
                <option value="blob">連通元件 (Blob)</option>
                <option value="template">模板匹配 (Template)</option>
                <option value="dl">深度學習模型 (COCO-SSD)</option>
            </select>
        </div>
        <div>
            <button id="sampleBtn">加入樣本</button>
            <button id="clearSamplesBtn">清除樣本</button>
            <div id="sampleInfo">樣本數: 0</div>
        </div>
        <div id="dlStatus" class="dl-status">模型未載入</div>
    </div>

    <script>
        // Load TensorFlow.js and coco-ssd model
        const tfjsScript = document.createElement('script');
        tfjsScript.src = 'https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0';
        tfjsScript.onload = () => {
            console.log('TensorFlow.js loaded');
            // Load coco-ssd after TF is ready
            const cocoScript = document.createElement('script');
            cocoScript.src = 'https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.1.0';
            cocoScript.onload = async () => {
                console.log('coco-ssd loaded');
                // Model will be loaded on demand when user selects DL
            };
            cocoScript.onerror = () => {
                console.error('Failed to load coco-ssd');
                dlStatusDiv.textContent = '模型載入失敗（coco-ssd）';
            };
            document.head.appendChild(cocoScript);
        };
        tfjsScript.onerror = () => {
            console.error('Failed to load TensorFlow.js');
            dlStatusDiv.textContent = '模型載入失敗（TensorFlow.js）';
        };
        document.head.appendChild(tfjsScript);

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const calibBtn = document.getElementById('calibBtn');
        const exportBtn = document.getElementById('exportBtn');
        const saveImgBtn = document.getElementById('saveImgBtn');
        const scoreDiv = document.getElementById('score');
        const controlsDiv = document.getElementById('controls');
        const radiusSlider = document.getElementById('radiusSlider');
        const radiusValue = document.getElementById('radiusValue');
        const centerXSpan = document.getElementById('centerX');
        const centerYSpan = document.getElementById('centerY');
        const darkThreshSlider = document.getElementById('darkThresh');
        const darkThreshVal = document.getElementById('darkThreshVal');
        const minAreaSlider = document.getElementById('minArea');
        const minAreaVal = document.getElementById('minAreaVal');
        const maxAreaSlider = document.getElementById('maxArea');
        const maxAreaVal = document.getElementById('maxAreaVal');
        const methodSelect = document.getElementById('methodSelect');
        const dlStatusDiv = document.getElementById('dlStatus');
        const sampleBtn = document.getElementById('sampleBtn');
        const clearSamplesBtn = document.getElementById('clearSamplesBtn');
        const sampleInfoDiv = document.getElementById('sampleInfo');

        let score = 0;
        let streaming = false;
        let videoStream = null;
        let calibrating = false;
        let detectedHolesLog = []; // {x,y,score,timestamp}
        let detectedHolesSet = []; // for duplicate filtering

        // 靶心與半徑
        let targetCenter = { x: canvas.width / 2, y: canvas.height / 2 };
        let targetRadius = 200;

        // 偵測參數
        let darkThreshold = 50;
        let minArea = 10;
        let maxArea = 500;
        let detectionMethod = 'blob'; // 'blob', 'template', 'dl'
        let cocoModel = null; // coco-ssd model
        let modelReady = false;

        // === 樣本收集相關 ===
        let samplingMode = false;
        let selecting = false;
        let startX = 0, startY = 0, endX = 0, endY = 0;
        // 儲存所有可用的模板（內建 + 使用者加入）
        // 每個模板結構: {width, height, data: Float32Array (已零均值、單位範數)}
        const allTemplates = [];

        // 內建模板：建議半徑 10px 的深色圓形 (可自行調整)
        function buildDefaultTemplate() {
            const templateRadius = 10;
            const templateSize = 2 * templateRadius + 1;
            const template = new Float32Array(templateSize * templateSize);
            let sum = 0;
            let idx = 0;
            for (let dy = -templateRadius; dy <= templateRadius; dy++) {
                for (let dx = -templateRadius; dx <= templateRadius; dx++) {
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    const val = 1 - dist/templateRadius; // 1 at centre, 0 at edge
                    template[idx] = val;
                    sum += val;
                    idx++;
                }
            }
            const mean = sum / template.length;
            for (let i = 0; i < template.length; i++) {
                template[i] -= mean;
            }
            let norm = 0;
            for (let i = 0; i < template.length; i++) {
                norm += template[i] * template[i];
            }
            norm = Math.sqrt(norm);
            if (norm === 0) norm = 1;
            for (let i = 0; i < template.length; i++) {
                template[i] /= norm;
            }
            return {width: templateSize, height: templateSize, data: template};
        }
        // 加入內建模板
        allTemplates.push(buildDefaultTemplate());

        // 判斷兩點是否同一彈孔
        function isSameHole(holeA, holeB, threshold = 15) {
            const dx = holeA.x - holeB.x;
            const dy = holeA.y - holeB.y;
            return Math.sqrt(dx*dx + dy*dy) < threshold;
        }

        // Blob 偵測 (連通元件)
        function detectBulletHoles_blob(imageData) {
            const width = imageData.width;
            const height = imageData.height;
            const data = imageData.data;
            const visited = new Uint8Array(width * height);
            const holes = [];

            const idx = (y, x) => (y * width + x) * 4;

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const i = idx(y, x);
                    const r = data[i];
                    const g = data[i + 1];
                    const b = data[i + 2];
                    const vi = y * width + x;
                    if (visited[vi]) continue;
                    if (r < darkThreshold && g < darkThreshold && b < darkThreshold) {
                        const stack = [[y, x]];
                        visited[vi] = 1;
                        let sumX = 0, sumY = 0, count = 0;
                        while (stack.length) {
                            const [cy, cx] = stack.pop();
                            sumX += cx;
                            sumY += cy;
                            count++;
                            const neighbours = [
                                [cy - 1, cx],
                                [cy + 1, cx],
                                [cy, cx - 1],
                                [cy, cx + 1]
                            ];
                            for (const [ny, nx] of neighbours) {
                                if (ny < 0 || ny >= height || nx < 0 || nx >= width) continue;
                                const nidx = idx(ny, nx);
                                const nv = ny * width + nx;
                                if (visited[nv]) continue;
                                const nr = data[nidx];
                                const ng = data[nidx + 1];
                                const nb = data[nidx + 2];
                                if (nr < darkThreshold && ng < darkThreshold && nb < darkThreshold) {
                                    visited[nv] = 1;
                                    stack.push([ny, nx]);
                                }
                            }
                        }
                        if (count >= minArea && count <= maxArea) {
                            holes.push({ x: sumX / count, y: sumY / count });
                        }
                    }
                }
            }
            return holes;
        }

        // 模板匹配偵測 (支援多個模板)
        function detectBulletHoles_template(imageData) {
            const width = imageData.width;
            const height = imageData.height;
            const data = imageData.data;
            const holes = [];

            // 轉換為灰度 (0-255)
            const gray = new Uint8ClampedArray(width * height);
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                gray[i/4] = 0.2126*r + 0.7152*g + 0.0722*b; // 標準 luminance
            }

            // 對每個模板進行滑動窗口正規化互相關
            allTemplates.forEach(tpl => {
                const tplWidth = tpl.width;
                const tplHeight = tpl.height;
                const halfW = Math.floor(tplWidth / 2);
                const halfH = Math.floor(tplHeight / 2);
                // 已經是零均值單位範數的 tpl.data
                for (let y = halfH; y < height - halfH; y++) {
                    for (let x = halfW; x < width - halfW; x++) {
                        let sum = 0;
                        let idx = 0;
                        for (let dy = -halfH; dy <= halfH; dy++) {
                            for (let dx = -halfW; dx <= halfW; dx++) {
                                const pos = ((y + dy) * width + (x + dx));
                                const val = gray[pos];
                                sum += val * tpl.data[idx];
                                idx++;
                            }
                        }
                        // 由於模板已正規化且窗口平均值為零？ 事實上我們需要將窗口也正規化。
                        // 為簡化，我們只使用原始點積作為相似度分數，並設定經驗值門檻。
                        // 這種做法在實際上可能會受亮度影響，但由於我們已對模板做零均值，且會用門檻過濾，仍可接受。
                        if (sum > 0.4) { // 經驗值，可依實際調整
                            holes.push({ x, y });
                        }
                    }
                }
            });
            return holes;
        }

        // 深度學習偵測 (使用 coco-ssd 偵測物件，過濾小物件當作彈孔)
        async function detectBulletHoles_dl(imageData) {
            if (!cocoModel || !modelReady) return [];
            // 轉換為 Tensor
            const imgTensor = tf.browser.fromPixels(imageData);
            // 模型會自動調整大小
            const predictions = await cocoModel.detect(imgTensor);
            imgTensor.dispose();
            // predictions 是陣列，每個有 {bbox: [x, y, width, height], class, score}
            // 我們假設彈孔為小物件，過濾掉太大的 bbox（例如面積超過一定比例）
            const holes = [];
            const imgWidth = imageData.width;
            const imgHeight = imageData.height;
            const maxBoxArea = 0.05 * imgWidth * imgHeight; // 例如佔畫面5%以下視為小物件
            for (const pred of predictions) {
                const [x, y, w, h] = pred.bbox;
                const area = w * h;
                if (area < maxBoxArea && pred.score > 0.4) { // 分數閾值可調
                    // 取 bbox 中心作為彈孔座標
                    holes.push({ x: x + w/2, y: y + h/2 });
                }
            }
            return holes;
        }

        function detectBulletHoles(imageData) {
            if (detectionMethod === 'blob') {
                return detectBulletHoles_blob(imageData);
            } else if (detectionMethod === 'template') {
                return detectBulletHoles_template(imageData);
            } else if (detectionMethod === 'dl') {
                // 非同步，實際呼叫在 processFrame 中
                return []; // placeholder
            }
            return [];
        }

        async function detectBulletHoles_async(imageData) {
            if (detectionMethod === 'dl') {
                return await detectBulletHoles_dl(imageData);
            } else {
                return detectBulletHoles(imageData);
            }
        }

        function calculateScore(hole) {
            const dx = hole.x - targetCenter.x;
            const dy = hole.y - targetCenter.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            const scoreRing = Math.max(0, 10 - Math.floor(distance / (targetRadius / 10)));
            return scoreRing;
        }

        async function processFrame() {
            if (!streaming) return;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            // 如果正在選取區域，畫出矩形
            if (selecting) {
                const scaleX = canvas.width / video.videoWidth;
                const scaleY = canvas.height / video.videoHeight;
                const sx = startX * scaleX;
                const sy = startY * scaleY;
                const ex = endX * scaleX;
                const ey = endY * scaleY;
                ctx.strokeStyle = 'lime';
                ctx.lineWidth = 2;
                ctx.strokeRect(sx, sy, ex - sx, ey - sy);
            }
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let holes = [];
            if (detectionMethod === 'dl') {
                holes = await detectBulletHoles_async(imageData);
            } else {
                holes = detectBulletHoles(imageData);
            }

            const newHoles = [];
            holes.forEach(hole => {
                const isDuplicate = detectedHolesSet.some(existing => isSameHole(hole, existing));
                if (!isDuplicate) {
                    newHoles.push(hole);
                    detectedHolesSet.push(hole);
                }
            });

            let frameScore = 0;
            newHoles.forEach(hole => {
                const holeScore = calculateScore(hole);
                frameScore += holeScore;
                ctx.beginPath();
                ctx.arc(hole.x, hole.y, 5, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,0,0,0.5)';
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.font = '12px Arial';
                ctx.fillText(holeScore, hole.x + 8, hole.y - 8);
                detectedHolesLog.push({
                    x: Math.round(hole.x),
                    y: Math.round(hole.y),
                    score: holeScore,
                    timestamp: new Date().toISOString()
                });
            });

            if (newHoles.length > 0) {
                score += frameScore;
                scoreDiv.textContent = `目前分數: ${score}`;
                exportBtn.style.display = 'inline-block';
                saveImgBtn.style.display = 'inline-block';
            }

            requestAnimationFrame(processFrame);
        }

        // 載入 coco-ssd 模型
        async function loadModel() {
            dlStatusDiv.textContent = '正在載入模型…';
            try {
                // @ts-ignore: cocoSsd is globally loaded after script
                cocoModel = await cocoSsd.load();
                modelReady = true;
                dlStatusDiv.textContent = '模型載入成功';
                console.log('Model loaded');
            } catch (err) {
                console.error('Failed to load model:', err);
                dlStatusDiv.textContent = '模型載入失敗，請檢查網路';
            }
        }

        startBtn.addEventListener('click', async () => {
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                video.srcObject = videoStream;
                streaming = true;
                startBtn.disabled = true;
                stopBtn.disabled = false;
                calibBtn.disabled = true;
                exportBtn.style.display = 'none';
                saveImgBtn.style.display = 'none';
                // 若切換到 DL 模式，嘗試載入模型
                if (methodSelect.value === 'dl' && !modelReady) {
                    await loadModel();
                }
                requestAnimationFrame(processFrame);
            } catch (err) {
                alert('無法存取攝影機: ' + err);
            }
        });

        stopBtn.addEventListener('click', () => {
            streaming = false;
            startBtn.disabled = false;
            stopBtn.disabled = true;
            calibBtn.disabled = false;
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            score = 0;
            detectedHolesLog = [];
            detectedHolesSet = [];
            scoreDiv.textContent = `目前分數: ${score}`;
            exportBtn.style.display = 'none';
            saveImgBtn.style.display = 'none';
        });

        calibBtn.addEventListener('click', () => {
            calibrating = !calibrating;
            if (calibrating) {
                calibBtn.textContent = '取消校正';
                controlsDiv.style.display = 'block';
                targetCenter.x = canvas.width / 2;
                targetCenter.y = canvas.height / 2;
                targetRadius = parseInt(radiusSlider.value);
                updateCenterDisplay();
                video.addEventListener('click', setCenterFromClick);
            } else {
                calibBtn.textContent = '校正靶位';
                controlsDiv.style.display = 'none';
                video.removeEventListener('click', setCenterFromClick);
            }
        });

        function setCenterFromClick(e) {
            const rect = video.getBoundingClientRect();
            const scaleX = video.videoWidth / rect.width;
            const scaleY = video.videoHeight / rect.height;
            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;
            targetCenter.x = x;
            targetCenter.y = y;
            updateCenterDisplay();
        }

        radiusSlider.addEventListener('input', () => {
            targetRadius = parseInt(radiusSlider.value);
            radiusValue.textContent = targetRadius;
        });

        darkThreshSlider.addEventListener('input', () => {
            darkThreshold = parseInt(darkThreshSlider.value);
            darkThreshVal.textContent = darkThreshold;
        });

        minAreaSlider.addEventListener('input', () => {
            minArea = parseInt(minAreaSlider.value);
            minAreaVal.textContent = minArea;
        });

        maxAreaSlider.addEventListener('input', () => {
            maxArea = parseInt(maxAreaSlider.value);
            maxAreaVal.textContent = maxArea;
        });

        methodSelect.addEventListener('change', () => {
            detectionMethod = methodSelect.value;
            if (detectionMethod === 'dl' && !modelReady) {
                loadModel();
            }
        });

        function updateCenterDisplay() {
            centerXSpan.textContent = Math.round(targetCenter.x);
            centerYSpan.textContent = Math.round(targetCenter.y);
        }

        // === 樣本收集功能 ===
        sampleBtn.addEventListener('click', () => {
            samplingMode = !samplingMode;
            if (samplingMode) {
                sampleBtn.classList.add('active');
                sampleBtn.textContent = '取消樣本收集';
            } else {
                sampleBtn.classList.remove('active');
                sampleBtn.textContent = '加入樣本';
            }
        });

        clearSamplesBtn.addEventListener('click', () => {
            // 保留內建模板，清除使用者樣本
            while (allTemplates.length > 1) {
                allTemplates.pop();
            }
            updateSampleCount();
        });

        function updateSampleCount() {
            const userCount = allTemplates.length - 1; // 減去內建模板
            sampleInfoDiv.textContent = `樣本數: ${userCount}`;
        }

        // 滑鼠事件用於框選樣本區域
        video.addEventListener('mousedown', (e) => {
            if (!samplingMode) return;
            selecting = true;
            const rect = video.getBoundingClientRect();
            const scaleX = video.videoWidth / rect.width;
            const scaleY = video.videoHeight / rect.height;
            startX = (e.clientX - rect.left) * scaleX;
            startY = (e.clientY - rect.top) * scaleY;
            endX = startX;
            endY = startY;
        });

        video.addEventListener('mousemove', (e) => {
            if (!selecting) return;
            const rect = video.getBoundingClientRect();
            const scaleX = video.videoWidth / rect.width;
            const scaleY = video.videoHeight / rect.height;
            endX = (e.clientX - rect.left) * scaleX;
            endY = (e.clientY - rect.top) * scaleY;
        });

        video.addEventListener('mouseup', (e) => {
            if (!selecting) return;
            selecting = false;
            const rect = video.getBoundingClientRect();
            const scaleX = video.videoWidth / rect.width;
            const scaleY = video.videoHeight / rect.height;
            endX = (e.clientX - rect.left) * scaleX;
            endY = (e.clientY - rect.top) * scaleY;
            // 正規化座標
            const x1 = Math.min(startX, endX);
            const y1 = Math.min(startY, endY);
            const x2 = Math.max(startX, endX);
            const y2 = Math.max(startY, endY);
            const w = x2 - x1;
            const h = y2 - y1;
            if (w > 0 && h > 0) {
                capturePatch(x1, y1, w, h);
            }
            // 選取結束後會在下一幀 processFrame 中不再畫矩形（selecting=false）
        });

        video.addEventListener('mouseleave', (e) => {
            if (selecting) {
                selecting = false;
            }
        });

        function capturePatch(x, y, w, h) {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = video.videoWidth;
            tempCanvas.height = video.videoHeight;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(video, 0, 0, video.videoWidth, video.videoHeight);
            const patchData = tempCtx.getImageData(x, y, w, h);
            // 轉為灰度並正規化 (零均值、單位範數)
            const gray = new Float32Array(w * h);
            const data = patchData.data;
            let sum = 0;
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                const v = 0.2126 * r + 0.7152 * g + 0.0722 * b;
                const idx = Math.floor(i / 4);
                gray[idx] = v;
                sum += v;
            }
            const mean = sum / gray.length;
            for (let i = 0; i < gray.length; i++) {
                gray[i] -= mean;
            }
            let norm = 0;
            for (let i = 0; i < gray.length; i++) {
                norm += gray[i] * gray[i];
            }
            norm = Math.sqrt(norm);
            if (norm === 0) norm = 1;
            for (let i = 0; i < gray.length; i++) {
                gray[i] /= norm;
            }
            // 加入模板列表
            allTemplates.push({ width: w, height: h, data: gray });
            updateSampleCount();
        }

        // 匯出紀錄為 CSV
        exportBtn.addEventListener('click', () => {
            if (detectedHolesLog.length === 0) {
                alert('目前沒有可匯出的紀錄');
                return;
            }
            const header = ['X座標', 'Y座標', '分數', '時間戳'];
            const rows = detectedHolesLog.map(entry => [
                entry.x,
                entry.y,
                entry.score,
                entry.timestamp
            ]);
            const csvContent = [header, ...rows]
                .map(e => e.map(v => `"${v}"`).join(','))
                .join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.setAttribute('href', url);
            link.setAttribute('download', `靶紙射擊紀錄_${new Date().toISOString().slice(0,19)}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        // 儲存當前影像 (畫布) 為 PNG
        saveImgBtn.addEventListener('click', () => {
            canvas.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.setAttribute('href', url);
                link.setAttribute('download', `靶紙畫面_${new Date().toISOString().slice(0,19)}.png`);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });
        });

        controlsDiv.style.display = 'none';
        updateSampleCount();
    </script>
</body>
</html>
